# Bundle patch layer for dsh-hindsight-panel.
# The row below loads the package's main entry as the host half (a plain
# Cordis plugin registering /api/dsh-hindsight-panel/* routes). The
# `dsh.client` declaration in package.json makes the web app load
# ./lib/client.js as the browser half that draws the sidebar entry and panel.
- insert:
    - id: dsh-hindsight-panel
      name: dsh-hindsight-panel
